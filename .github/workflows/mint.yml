name: Modular arithmetic

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - name: Test modular arithmetic and FPS integration
        env:
          CXX: ${{ matrix.compiler }}
          CXXFLAGS: -O2 -g -Wall -Wextra -Wconversion -fsanitize=address,undefined -fno-sanitize-recover=all
        run: doc/scripts/run-parallel.sh stress-tests/number-theory/ModInt.cpp stress-tests/numerical/PolyOps.cpp stress-tests/numerical/PolySamples.cpp
