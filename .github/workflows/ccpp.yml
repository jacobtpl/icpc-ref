name: C/C++ CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Compile every header
      run: make test-compiles
    - name: Run stress tests
      run: make test

  macos-arm64:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Compile every header (Homebrew g++-16 on Apple Silicon)
      run: |
        uname -m
        CXX=g++-16
        $CXX --version
        echo "CXX=$CXX" >> $GITHUB_ENV
        CXX=$CXX make test-compiles
    - name: Run stress tests
      run: make test
