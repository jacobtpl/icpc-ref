name: C/C++ CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Compile every header
      run: make test-compiles
    - name: Run stress tests
      run: make test

  macos-arm64:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Compile every header (Homebrew g++-16 on Apple Silicon)
      run: |
        uname -m
        CXX=g++-16
        $CXX --version
        # g++-16's bits/stdc++.h no longer includes cassert
        echo "CXX=$CXX" >> $GITHUB_ENV
        echo "CXXFLAGS=-include cassert" >> $GITHUB_ENV
        CXX=$CXX CXXFLAGS="-include cassert" make test-compiles
    # Known to fail on main: some geometry tests assume an 80-bit long double.
    - name: Run stress tests
      continue-on-error: true
      run: make test
