name: Geometry

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    env:
      CXX: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v4
      - name: Geometry stress tests
        env:
          CXXFLAGS: -O2 -Wall -Wconversion
          REQUIRE_PASS_LINE: 1
        run: doc/scripts/run-parallel.sh stress-tests/geometry/*.cpp
      - name: Geometry regression tests with sanitizers
        env:
          CXXFLAGS: -O2 -g -Wall -Wextra -Wconversion -fsanitize=address,undefined -fno-sanitize-recover=all
          REQUIRE_PASS_LINE: 1
          ASAN_OPTIONS: detect_leaks=1
        run: |
          doc/scripts/run-parallel.sh \
            stress-tests/geometry/{Primitive,PolygonRobustness,CircleRobustness,TriangulationRobustness,SpatialRobustness}*.cpp \
            stress-tests/geometry/{FastDelaunay,ManhattanMST,PolygonUnion}.cpp
