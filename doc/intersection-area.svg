<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc">
  <title id="title">Triangles acX and acd share a base</title>
  <desc id="desc">X lies one third of the way along cd and on line ab. The highlighted triangle acX has one third of the height and area of triangle acd.</desc>
  <rect width="760" height="460" fill="white"/>
  <g font-family="sans-serif" font-size="21" fill="#222" stroke-linejoin="round">
    <path d="M80 370 L440 370 L640 210 L200 130 Z" fill="none" stroke="#aaa" stroke-dasharray="6 7"/>
    <path d="M80 370 L440 370 L200 130 Z" fill="#eee" stroke="#666" stroke-width="2"/>
    <path d="M80 370 L440 370 L360 290 Z" fill="#c5d7ff" stroke="#2563eb" stroke-width="3"/>
    <path d="M80 370 L640 210" stroke="#444" stroke-width="2.5"/>
    <path d="M80 370 L440 370" stroke="#222" stroke-width="4"/>
    <path d="M200 130 V370 M200 360 h10 v10" fill="none" stroke="#666" stroke-width="1.5" stroke-dasharray="5 5"/>
    <path d="M360 290 V370 M360 360 h10 v10" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 5"/>
    <g fill="#222">
      <circle cx="80" cy="370" r="4"/><circle cx="440" cy="370" r="4"/>
      <circle cx="200" cy="130" r="4"/><circle cx="640" cy="210" r="4"/>
    </g>
    <circle cx="360" cy="290" r="5" fill="#2563eb"/>
    <g font-style="italic" font-size="25">
      <text x="55" y="377">a</text><text x="452" y="377">c</text>
      <text x="184" y="111">d</text><text x="653" y="200">b</text>
      <text x="373" y="265" fill="#2563eb">X</text>
    </g>
    <text x="183" y="157" text-anchor="end">H</text>
    <text x="346" y="335" text-anchor="end" fill="#2563eb">h = sH</text>
    <text x="260" y="412" text-anchor="middle">shared base ac</text>
    <text x="380" y="40" text-anchor="middle">CX / CD = h / H = area(acX) / area(acd) = s</text>
    <text x="380" y="446" text-anchor="middle" font-size="17">Shown: s = 1/3, area(acd) = 27, area(acX) = 9</text>
  </g>
</svg>
